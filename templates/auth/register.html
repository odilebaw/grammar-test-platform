{% extends "base.html" %}

{% block title %}Ro'yxatdan o'tish - Grammatika Test{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Ro'yxatdan o'tish</h2>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="username" class="form-label">Foydalanuvchi nomi</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Foydalanuvchi nomini kiriting"
                               required autocomplete="username">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Parol</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Parol kiriting (kamida 6 belgi)"
                               required autocomplete="new-password">
                    </div>

                    <div class="mb-4">
                        <label for="password_confirm" class="form-label">Parolni tasdiqlash</label>
                        <input type="password" class="form-control" id="password_confirm" name="password_confirm"
                               placeholder="Parolni qayta kiriting"
                               required autocomplete="new-password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Ro'yxatdan o'tish
                        </button>
                    </div>
                </form>
                <hr>
                <p class="text-center mb-0">
                    Hisobingiz bormi? <a href="{{ url_for('auth.login') }}">Tizimga kiring</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
